# Render deployment — Member 6.
# The API is stateless apart from the SQLite cache, which lives on the instance disk and is
# rebuilt on demand, so a free-tier restart costs nothing but a cold cache.
services:
  - type: web
    name: sif-detector-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Set these in the Render dashboard, never in this file.
      - key: SUPABASE_DB_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false

      # ---------------------------------------------------------------------
      # Not secret, but pinned here so a redeploy cannot silently change what
      # the classifier does.
      # ---------------------------------------------------------------------

      # Part of the classification cache key. It MUST move whenever the prompt
      # moves, or the instance keeps serving answers produced by a prompt we no
      # longer ship - and the cache has no expiry, so those answers never age
      # out on their own.
      #
      # Bumped to v6 for the Gate 2 absent/unclear clarification (g2fix1).
      #
      # If this key is also set in the Render dashboard, the dashboard wins.
      # Check it: a stale value there silently defeats this file.
      - key: PROMPT_VERSION
        value: "v6"

      # The free tier is slower than a laptop and gpt-oss-20b can need well over
      # ten seconds under load. A premature timeout does not fail loudly - it
      # discards a good answer and returns the much weaker baseline instead.
      - key: LLM_TIMEOUT_SECONDS
        value: "60"